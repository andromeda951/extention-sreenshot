<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coding Kids Monitor</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="header">
      <h1 class="app-title">Coding Kids Monitor</h1>
    </header>

    <main class="content">
      <!-- Form Section: Mode, Student Name & Room Code -->
      <section class="card form-card">
        <div class="form-group">
          <label for="modeSelect" class="form-label">Mode</label>
          <select id="modeSelect" class="form-input">
            <option value="student">Student</option>
            <option value="teacher">Teacher</option>
          </select>
        </div>
        <div class="form-group" id="studentNameGroup">
          <label for="studentName" class="form-label">Student Name</label>
          <input type="text" id="studentName" class="form-input" placeholder="Masukkan nama siswa" autocomplete="off">
        </div>
        <div class="form-group">
          <label for="roomCode" class="form-label">Room Code</label>
          <input type="text" id="roomCode" class="form-input" placeholder="Masukkan room code" autocomplete="off">
        </div>
        <div class="form-row-status">
          <span class="form-status-label">Status:</span>
          <span id="connectionStatus" class="status-badge status-disconnected">Disconnected</span>
        </div>
        <div class="action-wrapper">
          <button id="connectBtn" class="btn btn-connect" type="button">Connect</button>
        </div>
      </section>

      <!-- Student List Section: hanya untuk mode Teacher -->
      <section id="studentListSection" class="info-card hidden">
        <div class="info-row">
          <span class="info-label">Students:</span>
        </div>
        <ul id="studentList" class="student-list"></ul>
      </section>

      <!-- Info Section: Scratch Tab -->
      <section class="info-card">
        <div class="info-row">
          <span class="info-label">Active tab:</span>
          <span id="tabStatus" class="status-badge status-loading">Memeriksa...</span>
        </div>
        <div class="info-row">
          <span class="info-label">Status:</span>
          <span id="monitorStatus" class="status-badge status-loading">Memeriksa...</span>
        </div>
      </section>

      <!-- Error Alert Message -->
      <div id="errorMessage" class="error-banner hidden" role="alert"></div>

      <!-- Action Button: Ambil Screenshot -->
      <div class="action-wrapper">
        <button id="captureBtn" class="btn btn-primary" type="button" disabled>
          Ambil Screenshot
        </button>
      </div>

      <!-- Screenshot Preview Section -->
      <section id="screenshotSection" class="screenshot-container hidden">
        <h2 class="screenshot-title">Screenshot:</h2>
        <div class="preview-box">
          <img id="screenshotPreview" class="preview-img" src="" alt="Preview screenshot Scratch">
        </div>
        <div class="action-wrapper">
          <button id="downloadBtn" class="btn btn-secondary" type="button">
            Download
          </button>
        </div>
      </section>
    </main>
  </div>

  <script src="popup.js"></script>
</body>
</html>
